name: Build TaishanPi image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-image.yml
      - scripts/**
      - app/**
      - requirements-arm64.txt

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y gdisk parted e2fsprogs zstd bzip2 curl device-tree-compiler
      - name: Build image
        run: sudo bash scripts/build-image.sh
      - name: Validate output
        run: |
          cd out
          sha256sum -c *.sha256
          test "$(find . -maxdepth 1 -name '*.img.zst' | wc -l)" -eq 1
      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: tspi-aibox-armbian-6.1.157
          path: |
            out/*.img.zst
            out/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Split image for GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f .cache/image-build/tspi-AIBox_6.1.157.img
          sudo chown -R "$USER:$USER" out
          df -h out
          image=$(find out -maxdepth 1 -name '*.img.zst' -print -quit)
          test -n "$image"
          # GitHub Releases limits each asset to less than 2 GiB.
          split -b 1900M -d -a 2 "$image" "$image.part-"
          test -s "$image.part-00"
          cat > out/REASSEMBLE.txt <<EOF
          Download all $(basename "$image").part-* files and $(basename "$image").sha256.
          Reassemble and verify on Linux/macOS:
            cat $(basename "$image").part-* > $(basename "$image")
            sha256sum -c $(basename "$image").sha256
          EOF
      - name: Publish image to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "ci-${{ github.run_number }}-${{ github.run_attempt }}" \
            out/*.img.zst.part-* out/*.sha256 out/REASSEMBLE.txt \
            --target "$GITHUB_SHA" \
            --title "TaishanPi image build #${{ github.run_number }}" \
            --notes-file out/REASSEMBLE.txt \
            --prerelease
